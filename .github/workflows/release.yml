name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the checkout is the recorded source
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "checked out $head, which differs from recorded source $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the distributions
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --disable-pip-version-check -r requirements/build.txt
          version="$(PYTHONPATH=src python -c 'import qew; print(qew.__version__)')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          python -m build
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate the SBOM and hashes
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          created="$(git show -s --format=%cI HEAD)"
          python scripts/release_metadata.py \
            --dist dist \
            --sbom release/qew.spdx.json \
            --checksums release/SHA256SUMS \
            --version "$VERSION" \
            --source-sha "$GITHUB_SHA" \
            --created "$created"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: release/qew.spdx.json

      - name: Attach the auditable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python scripts/upload_release.py
          --tag "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          dist/* release/*
