[metadata]
name = qew
version = attr: qew.__version__
description = Offline-first work ledger mirrored to GitHub, Forgejo/Gitea and GitLab
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE
classifiers =
    License :: OSI Approved :: Apache Software License

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    qew = qew.__main__:main
