[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = ["explicit-override", "ignore-without-code", "redundant-expr", "truthy-bool", "unused-awaitable"]
files = ["src/qew"]
mypy_path = "src"

[tool.ruff]
target-version = "py315"
line-length = 160
src = ["src"]

[tool.ruff.lint]
# Modern typing only: built-in generics, X | None, no deprecated typing imports, no unused imports.
select = ["UP", "F401"]
ignore = ["UP042"]  # (str, Enum) keeps str() as "Class.member"; StrEnum would change it
